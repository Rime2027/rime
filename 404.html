<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在 | 星宇·航图</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%90%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --color-primary: #3B82F6;
            --color-secondary: #6366F1;
            --color-text: #1E293B;
            --color-text-light: #64748B;
            --color-card: #FFFFFF;
            --radius-lg: 20px;
            --shadow-lg: 0 10px 25px rgba(59, 130, 246, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 100%);
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: var(--color-text);
            text-align: center;
        }

        .card {
            background: var(--color-card);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 56px 40px;
            max-width: 520px;
            width: 100%;
        }

        .code {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(90deg, var(--color-primary), var(--color-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 12px;
        }

        .desc {
            color: var(--color-text-light);
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 50px;
            background: var(--color-primary);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .btn:hover,
        .btn:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35);
        }

        @media (max-width: 480px) {
            .card {
                padding: 40px 24px;
            }

            .code {
                font-size: 3.6rem;
            }

            h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <p class="code">404</p>
        <h1>这颗星还没被点亮</h1>
        <p class="desc">你要找的页面不存在，或者已经被移动到别处。</p>
        <a href="/" class="btn">返回首页</a>
    </main>
</body>

</html>
