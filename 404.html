<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在 | 星宇·航图</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%90%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            width: 100%;
            max-width: 720px;
            text-align: left;
        }

        /* 超大数字：页面的视觉主体，不靠装饰 */
        .code {
            font-size: clamp(6rem, 19vw, 12rem);
            font-weight: 800;
            line-height: 0.86;
            letter-spacing: -0.05em;
            color: var(--color-primary);
            margin-bottom: 28px;
        }

        h1 {
            font-size: clamp(1.5rem, 3.4vw, 2.1rem);
            font-weight: 650;
            letter-spacing: -0.02em;
            color: var(--color-text-dark);
            margin-bottom: 14px;
        }

        .desc {
            font-size: 1.05rem;
            color: var(--color-text-light);
            max-width: 520px;
            margin-bottom: 36px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        /* 直角按钮：不要圆角 */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 30px;
            border: 1px solid var(--color-border-strong);
            border-radius: 0;
            background-color: transparent;
            color: var(--color-text);
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
        }

        .btn:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        .btn--primary {
            background-color: var(--color-primary);
            border-color: var(--color-primary);
            color: #FFFFFF;
        }

        .btn--primary:hover {
            background-color: var(--color-primary-hover);
            border-color: var(--color-primary-hover);
            color: #FFFFFF;
        }

        @media (max-width: 480px) {
            body {
                padding: 28px 20px;
            }

            .code {
                margin-bottom: 20px;
            }

            .desc {
                margin-bottom: 28px;
            }

            .btn {
                padding: 12px 22px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>
    <main class="wrap">
        <p class="code">404</p>
        <h1>页面不存在</h1>
        <p class="desc">你访问的地址可能已被移动、删除，或者从未存在过。</p>
        <div class="actions">
            <a href="/" class="btn btn--primary">返回首页</a>
            <a href="/#tools" class="btn">浏览工具</a>
        </div>
    </main>
</body>

</html>
