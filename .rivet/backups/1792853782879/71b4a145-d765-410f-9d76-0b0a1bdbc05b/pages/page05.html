            });
        }

        // 设置搜索功能
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            let searchTimeout;

            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    performSearch(this.value.trim());
                }, 300);
            });
        }

        // 执行搜索
        function performSearch(searchTerm) {
            const cards = document.querySelectorAll('.category-card');
            let hasResults = false;

            cards.forEach(card => {
                const categoryName = card.querySelector('.category-title').textContent.toLowerCase();
                let hasMatch = categoryName.includes(searchTerm.toLowerCase());
                
                const softwareItems = card.querySelectorAll('.software-item');
                let visibleItems = 0;

                softwareItems.forEach(item => {
                    const softwareName = item.querySelector('.software-name').textContent.toLowerCase();
                    const softwareDesc = item.querySelector('.software-desc').textContent.toLowerCase();
                    
                    const matches = softwareName.includes(searchTerm.toLowerCase()) || 
                                    softwareDesc.includes(searchTerm.toLowerCase());
                    
                    if (matches || hasMatch) {
                        item.style.display = 'flex';
                        visibleItems++;
                        
                        // 高亮匹配的文本
                        if (searchTerm) {
                            highlightText(item.querySelector('.software-name'), searchTerm);
                            highlightText(item.querySelector('.software-desc'), searchTerm);
                        } else {
                            removeHighlight(item.querySelector('.software-name'));
                            removeHighlight(item.querySelector('.software-desc'));
                        }
                    } else {
                        item.style.display = 'none';
                    }
                });

                // 显示或隐藏整个分类卡片
                if (visibleItems > 0 || categoryName.includes(searchTerm.toLowerCase())) {
                    card.style.display = 'block';
                    hasResults = true;
                } else {
                    card.style.display = 'none';
                }
            });

            // 显示无结果消息
            const existingNoResults = document.querySelector('.no-results');
            if (!hasResults && searchTerm) {
                if (!existingNoResults) {
                    const noResults = document.createElement('div');
                    noResults.className = 'no-results';
                    noResults.innerHTML = `
                        <i class="fas fa-search"></i>
                        <h3>未找到匹配的软件</h3>
                        <p>请尝试使用其他关键词搜索</p>
                    `;
                    document.getElementById('categoriesGrid').appendChild(noResults);
                }
            } else if (existingNoResults) {
                existingNoResults.remove();
            }
        }

        // 高亮文本
        function highlightText(element, searchTerm) {
            const text = element.textContent;
            const regex = new RegExp(`(${searchTerm})`, 'gi');
            const newText = text.replace(regex, '<span class="highlight">$1</span>');
            element.innerHTML = newText;
        }

        // 移除高亮
        function removeHighlight(element) {
            element.innerHTML = element.textContent;
        }

        // 按分类筛选
        function filterByCategory() {
            const category = this.dataset.category;
            
            // 更新活动按钮
            document.querySelectorAll('.category-filter').forEach(btn => {
                btn.classList.remove('active');
            });
            this.classList.add('active');
            
            // 筛选卡片
            const cards = document.querySelectorAll('.category-card');
            cards.forEach(card => {
                if (category === 'all' || card.dataset.category === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
            
            // 清除搜索框
            document.getElementById('searchInput').value = '';
            
            // 移除搜索结果高亮
            document.querySelectorAll('.software-name, .software-desc').forEach(el => {
                removeHighlight(el);
            });
        }
    </script>
</body>
</html>
